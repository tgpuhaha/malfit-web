<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>말핏 | AI 자막 자동 생성</title>
<style>
  :root { --bg:#0b1020; --card:#121a33; --text:#f2f5ff; --muted:#a9b4d0; --accent:#6ee7ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Apple SD Gothic Neo,Roboto,sans-serif}
  .wrap{max-width:880px;margin:48px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid #263154;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  h1{margin:0 0 12px;font-size:28px;letter-spacing:.2px}
  p.sub{margin:0 0 18px;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input[type=file]{display:none}
  .btn{display:inline-flex;gap:10px;align-items:center;cursor:pointer;background:#1b2a55;color:#e9f3ff;border:1px solid #2e3a66;border-radius:12px;padding:12px 16px;font-weight:600}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn.solid{background:#324a96}
  .btn.alt{background:#263154}
  .btn.google{background:#2b6b3f}
  .lang, .text{background:#0f1733;border:1px solid #2b3861;color:#e9f3ff;border-radius:10px;padding:10px;width:100%}
  progress{width:100%;height:12px;appearance:none;border:none;border-radius:999px;background:#223058;overflow:hidden}
  progress::-webkit-progress-bar{background:#223058}
  progress::-webkit-progress-value{background:linear-gradient(90deg,#6ee7ff,#7aaaff)}
  .grid{display:grid;gap:10px}
  .kvs{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center}
  .muted{color:var(--muted);font-size:14px}
  a.dl{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid #30407a}
  .hint{font-size:13px;color:#9fb2ff}
  .foot{margin-top:18px;color:#7f8ab3;font-size:12px}
  .hidden{display:none}
  .ok{color:#78ffcc}
  .err{color:#ff8e8e}
  .warn{color:#ffd479}
</style>

<!-- Supabase UMD (v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // 🔑 Supabase 프로젝트 값으로 교체
  const SB_URL  = "https://YOUR-PROJECT.supabase.co";   // 예: https://abcdxyz.supabase.co
  const SB_ANON = "YOUR-ANON-KEY";                      // Settings → API → anon public
  const sb = supabase.createClient(SB_URL, SB_ANON, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  // 설정 누락 가드
  if (!SB_URL.includes('.supabase.co') || SB_ANON.length < 20) {
    setTimeout(()=>alert('Supabase 설정(SB_URL, SB_ANON)을 올바르게 입력하세요.\nDashboard → Settings → API에서 복사.'), 0);
  }
</script>
</head>
<body>

  <!-- 상단 인증 바 -->
  <div id="authbar" style="background:#0f1733;border-bottom:1px solid #28335a">
    <div style="max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between">
      <div id="whoami" class="muted">로그인 필요</div>
      <div class="row">
        <button class="btn" id="btnOpenLogin">로그인</button>
        <button class="btn" id="btnOpenSignup">회원가입</button>
        <button class="btn hidden" id="btnLogout">로그아웃</button>
      </div>
    </div>
  </div>

  <!-- 로그인/가입 모달 -->
  <div id="authModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50">
    <div style="width:420px;max-width:92vw" class="card">
      <h2 id="authTitle" style="margin:0 0 12px">로그인</h2>

      <!-- 전환/힌트 -->
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div id="authHint" class="muted">이메일과 비밀번호를 입력하세요.</div>
        <button id="authSwitch" class="btn alt" style="padding:8px 12px">회원가입으로 전환</button>
      </div>

      <!-- Google OAuth (원하면 숨김 처리 가능) -->
      <button id="btnGoogle" class="btn google">Google로 계속</button>

      <div class="grid">
        <input id="authEmail" class="text" placeholder="이메일" autocomplete="email">
        <input id="authPw" class="text" placeholder="비밀번호" autocomplete="current-password" type="password">
        <button id="authSubmit" class="btn solid">로그인</button>
        <div id="authMsg" class="muted"></div>
        <button id="authClose" class="btn" style="background:#2a375f">닫기</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>말핏 — AI 자막 자동 생성</h1>
      <p class="sub">MP4 업로드 → Whisper 전사 → (강한) 재작성 SRT → 보이스오버 대본(.txt)</p>

      <div class="grid" style="gap:16px">
        <div class="kvs">
          <span class="muted">API</span>
          <div class="row" style="flex:1">
            <input id="api" class="text" value="https://malfit-backend.onrender.com">
          </div>
        </div>

        <div class="kvs">
          <span class="muted">언어</span>
          <select id="lang" class="lang">
            <option value="ko" selected>한국어 (ko)</option>
            <option value="en">영어 (en)</option>
            <option value="ja">일본어 (ja)</option>
          </select>
        </div>

        <div class="row">
          <label class="btn" for="fileInput">🎥 파일 선택(MP4)</label>
          <input id="fileInput" type="file" accept="video/mp4,video/mov,video/m4v,video/webm" />
          <button id="uploadBtn" class="btn" disabled>⬆️ 업로드 & 처리 시작</button>
          <span id="fileInfo" class="muted"></span>
        </div>

        <div id="sectionProgress" class="hidden">
          <div class="kvs">
            <span class="muted">상태</span>
            <div id="statusText">대기 중…</div>
          </div>
          <progress id="bar" max="100" value="0"></progress>
          <div class="hint">무료 MVP는 <b>200MB</b> 이하 권장. 대용량은 S3/R2 직업로드 버전으로 확장.</div>
        </div>

        <div id="sectionLinks" class="hidden">
          <div class="kvs">
            <span class="muted">결과</span>
            <div class="grid">
              <a id="lnkSrt" class="dl" href="#" target="_blank">📄 원본 SRT</a>
              <a id="lnkRew" class="dl" href="#" target="_blank">🧠 재작성 SRT</a>
              <a id="lnkVo"  class="dl" href="#" target="_blank">🎙️ 보이스오버 대본(.txt)</a>
            </div>
          </div>
          <div class="foot">Tip: 결과물을 그대로 써도 되고, 에디터에서 추가 편집 후 쓰면 품질이 더 올라가요.</div>
        </div>

        <div id="sectionMsg" class="muted"></div>
      </div>
    </div>
  </div>

<script>
/* ===== 인증 UI ===== */
const $$ = (id)=>document.getElementById(id);
const whoami = $$('whoami');
const btnOpenLogin  = $$('btnOpenLogin');
const btnOpenSignup = $$('btnOpenSignup');
const btnLogout     = $$('btnLogout');
const authModal  = $$('authModal');
const authTitle  = $$('authTitle');
const authEmail  = $$('authEmail');
const authPw     = $$('authPw');
const authSubmit = $$('authSubmit');
const authMsg    = $$('authMsg');
const authClose  = $$('authClose');
const authSwitch = $$('authSwitch');
const authHint   = $$('authHint');
const btnGoogle  = $$('btnGoogle');

let authMode = "login"; // "login" | "signup"

function syncAuthModeUI(){
  if (authMode === "login") {
    authTitle.textContent = "로그인";
    authSwitch.textContent = "회원가입으로 전환";
    authSubmit.textContent = "로그인";
    authHint.textContent = "이메일과 비밀번호를 입력하세요.";
  } else {
    authTitle.textContent = "회원가입";
    authSwitch.textContent = "로그인으로 전환";
    authSubmit.textContent = "가입하기";
    authHint.textContent = "가입에 사용할 이메일과 비밀번호를 설정하세요.";
  }
}
function openAuth(mode){
  authMode = mode;
  authEmail.value = ""; authPw.value = ""; authMsg.textContent = "";
  syncAuthModeUI();
  authModal.classList.remove("hidden");
  setTimeout(()=>authEmail.focus(), 0);
}
function closeAuth(){ authModal.classList.add("hidden"); }

btnOpenLogin.onclick  = ()=>openAuth("login");
btnOpenSignup.onclick = ()=>openAuth("signup");
authClose.onclick     = closeAuth;

// 모달 내 전환
authSwitch.onclick = ()=>{
  authMode = (authMode === "login") ? "signup" : "login";
  syncAuthModeUI();
  authMsg.textContent = "";
  setTimeout(()=>authEmail.focus(), 0);
};

// Google OAuth (Supabase → Auth → Providers → Google 활성화 필요)
btnGoogle.onclick = async ()=>{
  try{
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin }
    });
    if (error) throw error;
  }catch(e){ alert(e.message||e); }
};

// 엔터로 제출
[authEmail, authPw].forEach(el=>{
  el.addEventListener('keydown', e=>{ if(e.key === 'Enter') authSubmit.click(); });
});

authSubmit.onclick = async () => {
  try{
    authSubmit.disabled = true; authMsg.textContent = "";
    const email = authEmail.value.trim();
    const password = authPw.value.trim();
    if (!email || !password) throw new Error("이메일/비밀번호를 입력하세요.");

    if (authMode === "signup") {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      authMsg.innerHTML = `<span class="ok">가입 완료! 이메일 확인 메일이 발송되었습니다.</span>`;
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      closeAuth();
    }
  } catch(e){
    console.error('[auth error]', e);
    authMsg.innerHTML = `<span class="err">${e.message||e}</span>`;
  } finally { authSubmit.disabled = false; }
};

btnLogout.onclick = async ()=>{ await sb.auth.signOut(); };

async function renderAuth(){
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    whoami.innerHTML = `안녕하세요, <b>${session.user.email}</b>`;
    btnOpenLogin.classList.add("hidden");
    btnOpenSignup.classList.add("hidden");
    btnLogout.classList.remove("hidden");
    if (window.__selectedFile) document.getElementById('uploadBtn').disabled = false;
  } else {
    whoami.textContent = "로그인 필요";
    btnOpenLogin.classList.remove("hidden");
    btnOpenSignup.classList.remove("hidden");
    btnLogout.classList.add("hidden");
    document.getElementById('uploadBtn').disabled = true;
  }
}
renderAuth();
sb.auth.onAuthStateChange(()=>renderAuth());

/* ===== 업로드/폴링 ===== */
(() => {
  const el = (id)=>document.getElementById(id);
  const apiInput = el('api');
  const fileInput = el('fileInput');
  const uploadBtn = el('uploadBtn');
  const fileInfo = el('fileInfo');
  const langSel = el('lang');
  const sectionProgress = el('sectionProgress');
  const statusText = el('statusText');
  const bar = el('bar');
  const sectionLinks = el('sectionLinks');
  const lnkSrt = el('lnkSrt');
  const lnkRew = el('lnkRew');
  const lnkVo  = el('lnkVo');
  const msg = el('sectionMsg');

  apiInput.value = localStorage.getItem('malfit_api') || apiInput.value;
  langSel.value  = localStorage.getItem('malfit_lang') || langSel.value;
  apiInput.addEventListener('change', ()=> localStorage.setItem('malfit_api', apiInput.value));
  langSel.addEventListener('change', ()=> localStorage.setItem('malfit_lang', langSel.value));

  let file, jobId, working = false;

  fileInput.addEventListener('change', async () => {
    file = fileInput.files?.[0];
    window.__selectedFile = !!file;
    sectionLinks.classList.add('hidden');
    msg.textContent = '';
    if (!file) { fileInfo.textContent = ''; uploadBtn.disabled = true; return; }
    fileInfo.textContent = `${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;

    const { data: { session } } = await sb.auth.getSession();
    uploadBtn.disabled = !session;
  });

  window.addEventListener('beforeunload', (e)=>{
    if (working) { e.preventDefault(); e.returnValue = ''; }
  });

  async function fetchWithTimeout(url, opt={}, ms=15000){
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), ms);
    try { return await fetch(url, {...opt, signal: ctrl.signal}); }
    finally { clearTimeout(t); }
  }

  uploadBtn.addEventListener('click', async () => {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { alert('로그인 후 이용하세요.'); return; }
      const accessToken = session.access_token;

      uploadBtn.disabled = true;
      const API_BASE = apiInput.value.replace(/\/+$/,'');
      if (!file) throw new Error('파일을 선택하세요.');
      if (!API_BASE) throw new Error('API 주소를 입력하세요.');

      sectionProgress.classList.remove('hidden');
      statusText.textContent = '업로드 중…';
      bar.value = 5;
      msg.textContent = '';
      working = true;

      const fd = new FormData();
      fd.append('file', file);
      fd.append('language', langSel.value);

      const up = await fetchWithTimeout(`${API_BASE}/upload`, {
        method:'POST', body: fd,
        headers: { "Authorization": `Bearer ${accessToken}` }
      }, 60000);

      if (!up.ok) {
        const t = await up.text();
        throw new Error(`업로드 실패: ${up.status} ${t}`);
      }
      ({ jobId } = await up.json());
      statusText.textContent = `작업 생성됨 (jobId: ${jobId})`;
      bar.value = 12;

      pollStatus(API_BASE, jobId, accessToken);

    } catch (e) {
      msg.innerHTML = `<span class="err">${e.message||e}</span>`;
      uploadBtn.disabled = false;
      working = false;
    }
  });

  let miss = 0;
  let interval = 2500;

  async function pollStatus(API_BASE, jobId, accessToken){
    try {
      const r = await fetchWithTimeout(`${API_BASE}/jobs/${jobId}?t=${Date.now()}`, {
        cache: "no-store",
        headers: { "Accept": "application/json", "Authorization": `Bearer ${accessToken}` },
        keepalive: true
      }, Math.min(15000, interval + 3000));

      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      const d = await r.json();

      miss = 0; interval = 2500;

      if (d.progress) bar.value = Math.max(bar.value, Number(d.progress)||0);
      if (d.status) statusText.textContent = statusLabel(d.status);

      if (d.status === 'done' || d.status === 'error') {
        working = false;
        if (d.status === 'error') {
          msg.innerHTML = `<span class="err">오류: ${d.error||'원인 불명'}</span>`;
          uploadBtn.disabled = false;
          return;
        }
        bar.value = 100;
        statusText.innerHTML = `<span class="ok">완료!</span>`;

        let srtUrl, rewUrl, voUrl;
        if (typeof d.result === 'string') {
          const parts = d.result.split('|').map(x=>x.trim());
          srtUrl = API_BASE + parts[0];
          rewUrl = API_BASE + parts[1];
          voUrl  = API_BASE + parts[2];
        } else if (d.result && typeof d.result === 'object') {
          srtUrl = (d.result.srt?.startsWith('http')? '' : API_BASE) + d.result.srt;
          rewUrl = (d.result.rewritten?.startsWith('http')? '' : API_BASE) + d.result.rewritten;
          voUrl  = (d.result.vo?.startsWith('http')? '' : API_BASE) + d.result.vo;
        }
        lnkSrt.href = srtUrl; lnkRew.href = rewUrl; lnkVo.href = voUrl;
        sectionLinks.classList.remove('hidden');
        uploadBtn.disabled = false;
        return;
      }

    } catch (e) {
      miss += 1;
      msg.innerHTML = `<span class="warn">상태 조회 실패(${miss}): ${e.message}</span>`;
      if (miss > 10) {
        working = false;
        msg.innerHTML = `<span class="err">상태 조회를 여러 번 실패했습니다. 잠시 후 다시 시도해주세요.</span>`;
        uploadBtn.disabled = false;
        return;
      }
      interval = Math.min(interval * 1.6, 10000);
    }
    setTimeout(async ()=>{
      const { data: { session } } = await sb.auth.getSession();
      const token = session?.access_token || "";
      pollStatus(apiInput.value.replace(/\/+$/,''), jobId, token);
    }, interval);
  }

  function statusLabel(s){
    switch(s){
      case 'queued': return '대기열…';
      case 'downloading': return '업로드 수신 중…';
      case 'audio_extract': return '오디오 추출 중 (ffmpeg)…';
      case 'whisper': return 'Whisper 전사 중…';
      case 'rewrite': return 'SRT (강한) 재작성 중…';
      case 'vo': return '보이스오버 대본 생성 중…';
      case 'done': return '완료';
      case 'error': return '오류';
      default: return s;
    }
  }
})();
</script>
</body>
</html>
