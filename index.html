<!-- ...위쪽 동일 -->

  <div class="wrap">
    <div class="card">
      <h1>말핏 — AI 자막 자동 생성</h1>
      <p class="sub">MP4 업로드 → Whisper 전사 → (강한) 재작성 SRT → 보이스오버 대본(.txt)</p>

      <div class="grid" style="gap:16px">
        <!-- (기존) API / 언어 / 업로드 UI 그대로 -->
        <!-- ... 기존 kvs/row/sectionProgress/sectionLinks/sectionMsg 그대로 ... -->

        <!-- 🔶 [추가] 결제한 충전코드 영역 -->
        <div id="sectionClaims" class="hidden" style="margin-top:8px;padding:16px;border:1px solid #2b3861;border-radius:12px;background:#0f1733">
          <h3 style="margin:0 0 8px">🔑 결제한 충전 코드</h3>
          <div id="claims-list" class="muted">불러오는 중…</div>
          <button id="redeem-all" class="btn" style="margin-top:12px;display:none">모두 적립하기</button>
          <div class="hint" style="margin-top:8px">구글 로그인 이메일과 강의사이트 결제 이메일이 같을 때 자동으로 표시됩니다.</div>
        </div>

      </div>
    </div>
  </div>

<!-- ... 아래 스크립트들 유지 -->

<script>
  /* ===== 인증: Google만 ===== */
  const whoami = document.getElementById('whoami');
  const btnGoogle = document.getElementById('btnGoogle');
  const btnLogout = document.getElementById('btnLogout');
  window.__selectedFile = false;

  btnGoogle.onclick = async ()=>{
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google', options: { redirectTo: location.origin }
    });
    if (error) alert(error.message);
  };

  btnLogout.onclick = async ()=>{
    try { btnLogout.disabled = true; } catch(e){}
    try { await sb.auth.signOut({ scope:'local' }); } catch(e){ console.warn(e); }
    try {
      for (let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith('sb-')){ localStorage.removeItem(k); i--; } }
    } catch(e){}
    try { sessionStorage.clear(); } catch(e){}

    // 섹션/버튼 초기화
    window.__selectedFile = false;
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput  = document.getElementById('fileInput');
    const fileInfo   = document.getElementById('fileInfo');
    const sectionLinks = document.getElementById('sectionLinks');
    const sectionProgress = document.getElementById('sectionProgress');
    const sectionMsg = document.getElementById('sectionMsg');
    const sectionClaims = document.getElementById('sectionClaims');
    const bar = document.getElementById('bar');
    const statusText = document.getElementById('statusText');

    if (fileInput) fileInput.value = "";
    if (fileInfo) fileInfo.textContent = "";
    if (uploadBtn) uploadBtn.disabled = true;
    if (sectionLinks) sectionLinks.classList.add('hidden');
    if (sectionProgress) sectionProgress.classList.add('hidden');
    if (sectionMsg) sectionMsg.textContent = "";
    if (sectionClaims) { sectionClaims.classList.add('hidden'); document.getElementById('claims-list').textContent = "불러오는 중…"; }
    if (bar) bar.value = 0;
    if (statusText) statusText.textContent = "대기 중…";

    await renderAuth();
    location.replace(location.origin + location.pathname);
  };

  async function renderAuth(){
    const { data:{ session } } = await sb.auth.getSession();
    const uploadBtn = document.getElementById('uploadBtn');
    if (session?.user) {
      whoami.innerHTML = `안녕하세요, <b>${session.user.email}</b>`;
      btnGoogle.classList.add('hidden');
      btnLogout.classList.remove('hidden');
      if (uploadBtn) uploadBtn.disabled = !(window.__selectedFile);
      // 🔶 로그인되면 충전코드 영역 로드
      try { await loadClaimsUI(); } catch(e){ console.warn(e); }
    } else {
      whoami.textContent = "로그인 필요";
      btnGoogle.classList.remove('hidden');
      btnLogout.classList.add('hidden');
      if (uploadBtn) uploadBtn.disabled = true;
      // 비로그인 시 숨김
      const sectionClaims = document.getElementById('sectionClaims');
      if (sectionClaims) sectionClaims.classList.add('hidden');
    }
  }
  renderAuth();
  sb.auth.onAuthStateChange(()=>renderAuth());
</script>

<script>
/* ===== 업로드/폴링 ===== */
(() => {
  const el = (id)=>document.getElementById(id);
  const apiInput = el('api'), fileInput = el('fileInput'), uploadBtn = el('uploadBtn');
  const fileInfo = el('fileInfo'), langSel = el('lang'), sectionProgress = el('sectionProgress');
  const statusText = el('statusText'), bar = el('bar'), sectionLinks = el('sectionLinks');
  const lnkSrt = el('lnkSrt'), lnkRew = el('lnkRew'), lnkVo = el('lnkVo'), msg = el('sectionMsg');

  apiInput.value = localStorage.getItem('malfit_api') || apiInput.value;
  langSel.value  = localStorage.getItem('malfit_lang') || langSel.value;
  apiInput.addEventListener('change', ()=> localStorage.setItem('malfit_api', apiInput.value));
  langSel.addEventListener('change', ()=> localStorage.setItem('malfit_lang', langSel.value));

  let file, jobId, working = false;

  fileInput.addEventListener('change', async () => {
    file = fileInput.files?.[0];
    window.__selectedFile = !!file;

    sectionLinks.classList.add('hidden');
    msg.textContent = '';

    if (!file) {
      fileInfo.textContent = '';
      uploadBtn.disabled = true;
      return;
    }

    fileInfo.textContent = `${file.name} (${(file.size/1024/1024).toFixed(1)} MB)`;
    const { data:{ session } } = await sb.auth.getSession();
    uploadBtn.disabled = !(session && file);
  });

  window.addEventListener('beforeunload', (e)=>{ if (working) { e.preventDefault(); e.returnValue=''; } });

  async function fetchWithTimeout(url, opt={}, ms=15000){
    const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), ms);
    try { return await fetch(url, {...opt, signal: ctrl.signal}); } finally { clearTimeout(t); }
  }

  // 🔧 공통: 인증 헤더 빌더
  async function authHeaders(){
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) return {};
    return {
      "Authorization": `Bearer ${session.access_token}`,
      "X-User-Id": session.user.id,
      "X-User-Email": session.user.email
    };
  }

  uploadBtn.addEventListener('click', async () => {
    try {
      const { data:{ session } } = await sb.auth.getSession();
      if (!session) { alert('Google 로그인 후 이용하세요.'); return; }
      const accessToken = session.access_token;

      uploadBtn.disabled = true;
      const API_BASE = apiInput.value.replace(/\/+$/,'');
      if (!file) throw new Error('파일을 선택하세요.');
      if (!API_BASE) throw new Error('API 주소를 입력하세요.');

      sectionProgress.classList.remove('hidden');
      statusText.textContent = '업로드 중…';
      bar.value = 5; msg.textContent = ''; working = true;

      const fd = new FormData();
      fd.append('file', file);
      fd.append('language', langSel.value);

      const up = await fetchWithTimeout(`${API_BASE}/upload`, {
        method:'POST', body: fd,
        headers: { "Authorization": `Bearer ${accessToken}` }
      }, 60000);

      if (!up.ok) { const t = await up.text(); throw new Error(`업로드 실패: ${up.status} ${t}`); }
      ({ jobId } = await up.json());
      statusText.textContent = `작업 생성됨 (jobId: ${jobId})`;
      bar.value = 12;

      pollStatus(API_BASE, jobId, accessToken);
    } catch (e) {
      msg.innerHTML = `<span class="err">${e.message||e}</span>`;
      uploadBtn.disabled = false; working = false;
    }
  });

  let miss = 0, interval = 2500;

  async function pollStatus(API_BASE, jobId, accessToken){
    try {
      const headers = { "Accept":"application/json", "Authorization":`Bearer ${accessToken}` };
      const r = await fetchWithTimeout(`${API_BASE}/jobs/${jobId}?t=${Date.now()}`, { cache:"no-store", headers, keepalive:true }, Math.min(15000, interval+3000));

      if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
      const d = await r.json(); miss = 0; interval = 2500;

      if (d.progress) bar.value = Math.max(bar.value, Number(d.progress)||0);
      if (d.status) statusText.textContent = statusLabel(d.status);

      if (d.status === 'done' || d.status === 'error') {
        working = false;
        if (d.status === 'error') { msg.innerHTML = `<span class="err">오류: ${d.error||'원인 불명'}</span>`; uploadBtn.disabled = false; return; }
        bar.value = 100; statusText.innerHTML = `<span class="ok">완료!</span>`;

        let srtUrl, rewUrl, voUrl;
        if (typeof d.result === 'string') {
          const parts = d.result.split('|').map(x=>x.trim());
          srtUrl = API_BASE + parts[0]; rewUrl = API_BASE + parts[1]; voUrl = API_BASE + parts[2];
        } else if (d.result && typeof d.result === 'object') {
          srtUrl = (d.result.srt?.startsWith('http')?'':API_BASE) + d.result.srt;
          rewUrl = (d.result.rewritten?.startsWith('http')?'':API_BASE) + d.result.rewritten;
          voUrl  = (d.result.vo?.startsWith('http')?'':API_BASE) + d.result.vo;
        }
        document.getElementById('lnkSrt').href = srtUrl;
        document.getElementById('lnkRew').href = rewUrl;
        document.getElementById('lnkVo').href  = voUrl;
        sectionLinks.classList.remove('hidden'); uploadBtn.disabled = false; return;
      }

    } catch (e) {
      miss += 1; msg.innerHTML = `<span class="err">상태 조회 실패(${miss}): ${e.message}</span>`;
      if (miss > 10) {
        working = false; msg.innerHTML = `<span class="err">상태 조회를 여러 번 실패했습니다. 잠시 후 다시 시도해주세요.</span>`;
        uploadBtn.disabled = false; return;
      }
      interval = Math.min(interval * 1.6, 10000);
    }
    setTimeout(()=>pollStatus(apiInput.value.replace(/\/+$/,''), jobId, accessToken), interval);
  }

  function statusLabel(s){
    switch(s){
      case 'queued': return '대기열…';
      case 'downloading': return '업로드 수신 중…';
      case 'audio_extract': return '오디오 추출 중 (ffmpeg)…';
      case 'whisper': return 'Whisper 전사 중…';
      case 'rewrite': return 'SRT (강한) 재작성 중…';
      case 'vo': return '보이스오버 대본 생성 중…';
      case 'done': return '완료';
      case 'error': return '오류';
      default: return s;
    }
  }

  // 🔶 [추가] 마이페이지 충전코드 UI ===============================
  async function loadClaimsUI(){
    const sectionClaims = document.getElementById('sectionClaims');
    const listBox = document.getElementById('claims-list');
    const redeemBtn = document.getElementById('redeem-all');
    const { data:{ session } } = await sb.auth.getSession();
    if (!session){ sectionClaims.classList.add('hidden'); return; }

    const API_BASE = apiInput.value.replace(/\/+$/,'');
    sectionClaims.classList.remove('hidden');
    listBox.textContent = '불러오는 중…';
    redeemBtn.style.display = 'none';

    const r = await fetch(`${API_BASE}/api/my_claims`, {
      headers: {
        ...(await authHeaders())
      }
    });
    if(!r.ok){
      listBox.textContent = '조회 실패';
      return;
    }
    const rows = await r.json();
    if(!rows.length){
      listBox.textContent = '미사용 충전 코드가 없습니다.';
      return;
    }
    listBox.innerHTML = rows.map(x => `
      <div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed #2b3861">
        <div>
          <div><b>주문번호</b> ${x.order_id}</div>
          <div><b>코드</b> ${x.token_masked}</div>
        </div>
        <div><b>+${x.credits}P</b></div>
      </div>
    `).join('');
    redeemBtn.style.display = 'inline-flex';

    redeemBtn.onclick = async ()=>{
      if(!confirm('모든 미사용 충전 코드를 내 계정으로 적립할까요?')) return;
      const rr = await fetch(`${API_BASE}/api/redeem_my_claims`, {
        method:'POST',
        headers: {
          'Content-Type':'application/json',
          ...(await authHeaders())
        }
      });
      const j = await rr.json();
      if(rr.ok){
        alert(`적립 완료: +${j.added}P (${j.count}건)`);
        loadClaimsUI();
      } else {
        alert(j.detail || '적립 실패');
      }
    };
  }
  // ===============================================================
})();
</script>
